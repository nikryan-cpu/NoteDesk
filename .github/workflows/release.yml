name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: Upload the installers to a draft release for the version in package.json
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Creates the draft once, so the three build jobs don't race to create one each.
  draft:
    if: github.event_name == 'push' || inputs.release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${tag#v}" >&2
            exit 1
          fi
          if gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -qx "$tag"; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "NoteDesk ${tag#v}" --target "$GITHUB_SHA" --notes ""
          fi

  build:
    needs: draft
    # Manual runs without a release still build, they just skip the draft job.
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            flag: --win
          - os: macos-latest
            flag: --mac
          - os: ubuntu-latest
            flag: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No code signing certificate yet; stops electron-builder from looking for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder downloads the Electron builds it packages on its own.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PUBLISH: ${{ (github.event_name == 'push' || inputs.release) && 'always' || 'never' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # With PUBLISH=always the installers go into the draft release (releaseType: draft),
      # which I review and then publish with the "Publish release" workflow.
      - run: npx electron-builder ${{ matrix.flag }} --publish ${{ env.PUBLISH }}

      - uses: actions/upload-artifact@v4
        with:
          name: notedesk-${{ matrix.os }}
          path: |
            release/*/*.exe
            release/*/*.dmg
            release/*/*.AppImage
            release/*/*.deb
          retention-days: 7
